name: Liga-Check

# Prüft einmal am Tag, ob alle Liga-IDs (Push und Website/App) noch zu unseren Teams passen.
# Schlägt der Lauf fehl, schickt GitHub eine Mail; die Probleme stehen in der Zusammenfassung des Laufs.
# Eigener Workflow, damit der Scheduler nie deswegen fehlschlägt (sonst würde state.json nicht gespeichert).

on:
  schedule:
    - cron: "17 6 * * *"   # täglich ca. 8:17 Uhr (Sommerzeit), GitHub startet oft später
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Liga-IDs prüfen
        run: node liga-check.mjs
