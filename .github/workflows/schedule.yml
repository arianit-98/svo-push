name: svo-push-scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      send_test_push:
        description: "Test-Push senden (nur manueller Start)"
        required: false
        default: "true"
      test_topic:
        description: "Topic für Test-Push (z.B. team_herren_h1)"
        required: false
        default: "team_herren_h1"

# Verhindert, dass zwei Läufe gleichzeitig state.json anfassen
concurrency:
  group: svo-push-state
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run scheduler
        env:
          FIREBASE_SA_B64: ${{ secrets.FIREBASE_SA_B64 }}
        run: node index.mjs

      - name: Send test push (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.send_test_push == 'true'
        env:
          FIREBASE_SA_B64: ${{ secrets.FIREBASE_SA_B64 }}
          TOPIC: ${{ inputs.test_topic }}
        run: node test-push.mjs

      - name: Commit & push state.json
        shell: bash
        run: |
          set -e

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add state.json
          git commit -m "Update push state" || true

          # Rebase auf neuesten Stand, um "fetch first" zu vermeiden
          git pull --rebase origin main

          # Push mit Retry (falls GitHub gerade parallel committet hat)
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed state.json successfully."
              exit 0
            fi
            echo "Push failed, retrying in 3s... ($i/3)"
            sleep 3
            git pull --rebase origin main
          done

          echo "Failed to push after retries."
          exit 1
