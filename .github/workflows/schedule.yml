name: Push Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"   # alle 5 Minuten
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: push-scheduler
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Run scheduler
        env:
          FIREBASE_SA_B64: ${{ secrets.FIREBASE_SA_B64 }}
          FORCE_PUSH_AT: ${{ secrets.FORCE_PUSH_AT }}
          FORCE_PUSH_TOPIC: ${{ secrets.FORCE_PUSH_TOPIC }}
          FORCE_PUSH_TITLE: ${{ secrets.FORCE_PUSH_TITLE }}
          FORCE_PUSH_BODY: ${{ secrets.FORCE_PUSH_BODY }}
        run: node index.mjs

      - name: Commit updated state/admin queue (only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # nur die Dateien, die wir wirklich versionieren wollen:
          git add admin_queue.json state.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update push state"

          git pull --rebase origin main
          git push origin main
