name: svo-push-scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install

      - name: Run scheduler
        env:
          FIREBASE_SA_B64: ${{ secrets.FIREBASE_SA_B64 }}
        run: node index.mjs

      - name: Send test push (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_SA_B64: ${{ secrets.FIREBASE_SA_B64 }}
          TOPIC: team_herren_h1
        run: node test-push.mjs

            - name: Commit state
        run: |
          if git diff --quiet; then
            echo "No state changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add state.json
          git commit -m "Update push state" || echo "Nothing to commit"

          # Wichtig: Remote Änderungen holen, dann pushen
          git pull --rebase origin main
          git push origin HEAD:main
