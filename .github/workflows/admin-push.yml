name: Admin Push

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Push title"
        required: true
        type: string
      body:
        description: "Push body"
        required: true
        type: string
      send_at:
        description: "Optional: Zeitpunkt (deutsche Zeit), z.B. 20.09.2026 17:00 oder 2026-09-20T17:00. Leer = sofort senden."
        required: false
        type: string

permissions:
  contents: write

jobs:
  admin_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      # Eingaben nur über env verwenden – direkt im Skript eingesetzt würde z.B. ein " im Titel
      # den Schritt abbrechen (bzw. Shell-Befehle ausführen).
      - name: Validate inputs
        env:
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
        run: |
          echo "Titel: ${#TITLE} Zeichen, Text: ${#BODY} Zeichen"

      - name: Send now OR enqueue
        env:
          FIREBASE_SA_B64: ${{ secrets.FIREBASE_SA_B64 }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          SEND_AT: ${{ inputs.send_at }}
        run: node scripts/admin_push_dispatch.mjs

      - name: Commit queue changes (if any)
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add admin_queue.json
          git commit -m "Admin push queued"

          # Der Scheduler committet parallel state.json – bei Konflikt neu aufsetzen und nochmal
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done
          exit 1
